# The Android app as a debug APK — signed by the build's own debug key, so it installs on a phone as is —
# in the run's artifacts: RestoApp-<run>.apk. No secret is involved; the release for Google Play is
# built and signed by hand on guibot2 (RELEASING.md), never here.
#
# Built on main and by hand, as the iPhone app is (ios.yml); a commit of notes alone builds nothing.
name: android

on:
  push:
    branches: [main]
    paths-ignore: ['.ai-notes/**', '**.md']
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

# Superizer as a built release (settings.gradle.kts), the version in gradle/libs.versions.toml — the same for the
# iPhone build (ios.yml). GitHub Packages wants a token even for a public package: the run's own GITHUB_TOKEN
# (packages: read) reads Superizer's, which is public; a SUPERIZER_PACKAGES_TOKEN secret (a classic PAT with
# read:packages) takes its place if it is ever set.
env:
  SUPERIZER_FROM_MAVEN: '1'
  ORG_GRADLE_PROJECT_SuperizerPackagesUsername: ${{ github.actor }}
  ORG_GRADLE_PROJECT_SuperizerPackagesPassword: ${{ secrets.SUPERIZER_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # No setup-android: the runner has its own SDK (ANDROID_HOME), and AGP fetches the platform and build tools
      # it lacks. setup-android@v3 fails there installing the long-gone `tools` package.
      - name: Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # The default branch is mobile-client, and setup-gradle writes its cache only there unless told
      # otherwise; main writes, the rest read (ios.yml).
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # The run number is the versionCode (composeApp/build.gradle.kts), so a newer APK installs over an older one.
      - name: Build the debug APK
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          ./gradlew --no-daemon --max-workers=2 "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8" \
            :composeApp:assembleDebug
          mkdir -p build/apk
          cp composeApp/build/outputs/apk/debug/composeApp-debug.apk "build/apk/RestoApp-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v7
        with:
          path: build/apk/RestoApp-${{ github.run_number }}.apk
          archive: false
          if-no-files-found: error
