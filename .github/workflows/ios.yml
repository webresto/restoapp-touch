# The iPhone app on a macOS runner. Two lanes, the way Unitool ships (../client, ios.yml):
#
#   testflight  Release, archived, signed and uploaded to App Store Connect (team Ivan Sizyi,
#               org.restoapp.touch). Started by a push to main, by hand on main, or by the label
#               `testflight` on a pull request into main — what the branch holds at that moment, once.
#               Runs only when the signing secrets are present; otherwise it says so and stops, green.
#               Then `distribute` waits for Apple to process the build and puts it in the TestFlight
#               group (RELEASING.md, iOS).
#   ipa         Unsigned: a plain RestoApp-<run>.ipa in the run's artifacts, no certificate and no
#               secret involved. To put it on a phone, it has to be signed where the certificate is.
#               On the branch ios-ipa, and by hand on any branch but main.
#
# macOS minutes cost ten Linux ones on a private repository, so a commit of notes alone builds nothing.
name: ios

on:
  pull_request:
    branches: [main]
    types: [labeled]
  push:
    branches: [main, ios-ipa]
    paths-ignore: ['.ai-notes/**', '**.md']
  workflow_dispatch:

# Read only: a run has nothing to push. What it leaves behind goes to its artifacts and to App Store
# Connect, never into git.
permissions:
  contents: read

# An upload is never cancelled: a push to main waits for the build before it. A newer push to
# ios-ipa stops the older build there.
concurrency:
  group: ios-${{ github.ref }}-${{ github.event.label.name || github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' }}

env:
  # The same runner, and the same flag, as Unitool's lanes (../client, ios.yml). Compose Multiplatform
  # 1.11.1 references UIViewLayoutRegion, an iOS 26 class, behind an availability check.
  OTHER_LDFLAGS: '$(inherited) -Wl,-U,_OBJC_CLASS_$_UIViewLayoutRegion'
  # Superizer as a built release, the version in gradle/libs.versions.toml — Android's too (android.yml, where the
  # token is explained). Its klibs come from Linux; the Mac only links the framework.
  SUPERIZER_FROM_MAVEN: '1'
  ORG_GRADLE_PROJECT_SuperizerPackagesUsername: ${{ github.actor }}
  ORG_GRADLE_PROJECT_SuperizerPackagesPassword: ${{ secrets.SUPERIZER_PACKAGES_TOKEN }}

jobs:
  ipa:
    if: github.event_name != 'pull_request' && github.ref != 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/ios-prepare

      # The build number is the run number, so two installs never carry the same CFBundleVersion.
      - name: Build for a device, unsigned
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios-dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            OTHER_LDFLAGS="$OTHER_LDFLAGS" \
            build 2>&1 | tee build/xcodebuild.log

      # An .ipa is a zip with the app under Payload/. -y keeps the symlinks of the bundle as symlinks.
      - name: Pack the .ipa
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios-dd/Build/Products/Release-iphoneos/RestoApp.app build/ipa/Payload/
          cd build/ipa
          zip -qry "RestoApp-${{ github.run_number }}.ipa" Payload

      # archive: false uploads the file itself, not a zip around it. The artifact takes the file's name.
      - uses: actions/upload-artifact@v7
        with:
          path: build/ipa/RestoApp-${{ github.run_number }}.ipa
          archive: false
          if-no-files-found: error

      # The log of a failed build is the one thing worth keeping from it, hence always().
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          retention-days: 14
          if-no-files-found: ignore

  testflight:
    if: >-
      github.event.label.name == 'testflight'
      || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
    runs-on: macos-26
    timeout-minutes: 75
    outputs:
      uploaded: ${{ steps.upload.outputs.uploaded }}
    steps:
      - uses: actions/checkout@v4

      # Secrets cannot be read in a job-level `if`, so the check is a step with an output. Missing
      # secrets end the job green with a notice: this lane is opt-in, not a gate.
      - name: Are the signing secrets here?
        id: gate
        env:
          P12: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          missing=""
          [ -n "$P12" ]          || missing="$missing IOS_DIST_CERT_P12_BASE64"
          [ -n "$P12_PASSWORD" ] || missing="$missing IOS_DIST_CERT_PASSWORD"
          [ -n "$PROFILE" ]      || missing="$missing IOS_PROFILE_BASE64"
          [ -n "$KEY_ID" ]       || missing="$missing ASC_KEY_ID"
          [ -n "$ISSUER_ID" ]    || missing="$missing ASC_ISSUER_ID"
          [ -n "$P8" ]           || missing="$missing ASC_KEY_P8_BASE64"
          if [ -n "$missing" ]; then
            echo "::notice::TestFlight lane skipped — secrets not set:$missing (RELEASING.md, iOS)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/ios-prepare
        if: steps.gate.outputs.ready == 'true'

      # Signed by hand, as Unitool and agentiz are. Automatic signing on a clean runner would have to
      # mint a development certificate every run, and the API key is an App Manager's. So the App
      # Store profile is a secret like the certificate; ios-ci-signing.py checks the two against each
      # other and the app, and points the build at them.
      - name: Install the certificate, the profile and the App Store Connect key
        if: steps.gate.outputs.ready == 'true'
        env:
          P12: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm "$RUNNER_TEMP/dist.p12"

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -m1 '"' || true)
          if [ -z "$IDENTITY" ]; then
            security find-identity -p codesigning "$KEYCHAIN"
            echo "::error::IOS_DIST_CERT_P12_BASE64 gave no valid signing identity (what it gave is above)"
            exit 1
          fi
          SHA1=$(echo "$IDENTITY" | awk '{print $2}')
          NAME=$(echo "$IDENTITY" | sed 's/^[^"]*"\(.*\)"$/\1/')
          echo "Signing as: $NAME"

          printf '%s' "$PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(python3 tools/ios-ci-signing.py "$RUNNER_TEMP/profile.plist" "$SHA1" "$NAME")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          mv "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

          mkdir -p "$HOME/private_keys"
          printf '%s' "$P8" | base64 --decode > "$HOME/private_keys/AuthKey_$KEY_ID.p8"

      # Info.plist says NO: standard algorithms off the French store, which Apple itself turns into
      # usesNonExemptEncryption = false (RELEASING.md). An upload that says YES must carry the key of
      # approved documentation, or Apple refuses it (ITMS-90592). So should Apple ever issue one, for
      # the French store, it is read here on every build and written in together with the YES.
      - name: Export compliance key
        if: steps.gate.outputs.ready == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          CODE=$(python3 tools/testflight-distribute.py --compliance-code)
          if [ -n "$CODE" ]; then
            plutil -replace ITSAppUsesNonExemptEncryption -bool YES iosApp/iosApp/Info.plist
            plutil -replace ITSEncryptionExportComplianceCode -string "$CODE" iosApp/iosApp/Info.plist
            echo "Info.plist declares the encryption, with its key"
          else
            echo "No encryption documentation key; export compliance is answered after the upload"
          fi

      # The build number is the run number, so every upload is a new build.
      - name: Archive
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath build/RestoApp.xcarchive \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            OTHER_LDFLAGS="$OTHER_LDFLAGS" \
            archive 2>&1 | tee build/xcodebuild.log

      # `destination: upload` in the export options sends the build straight to App Store Connect;
      # it appears under TestFlight once Apple has processed it.
      - name: Upload to TestFlight
        id: upload
        if: steps.gate.outputs.ready == 'true'
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive -archivePath build/RestoApp.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" \
            2>&1 | tee build/export.log
          echo "uploaded=true" >> "$GITHUB_OUTPUT"

      - name: Forget the key
        if: always()
        run: |
          rm -rf "$HOME/private_keys" "$RUNNER_TEMP/signing.keychain-db" "$RUNNER_TEMP/profile.plist" \
            iosApp/Configuration/Signing.xcconfig || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: testflight-logs
          path: |
            build/xcodebuild.log
            build/export.log
          retention-days: 14
          if-no-files-found: ignore

  # An upload reaches nobody by itself: Apple processes it for minutes, and then it has to be put in
  # a TestFlight group. That wait happens here, on Linux, where it costs a tenth of the Mac's. The
  # group is the repository variable TESTFLIGHT_GROUP, `dev` when unset.
  distribute:
    needs: testflight
    if: needs.testflight.outputs.uploaded == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Apple, then give the build to the testers
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: python3 tools/testflight-distribute.py ${{ github.run_number }} "${{ vars.TESTFLIGHT_GROUP || 'dev' }}"
