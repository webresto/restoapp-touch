# The steps every iOS job starts with: a JDK, Gradle, the Kotlin/Native toolchain and the Kotlin framework linked.
# Superizer comes built (SUPERIZER_FROM_MAVEN in ios.yml). One place, so the lanes in ios.yml cannot drift apart.
name: ios-prepare
description: Set up Java, Gradle and ~/.konan, link the Kotlin framework for Release on a device

runs:
  using: composite
  steps:
    - name: Xcode
      shell: bash
      run: xcodebuild -version && xcrun --sdk iphoneos --show-sdk-version

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'

    # The default branch is mobile-client, and setup-gradle writes its cache only there unless told
    # otherwise: every build on main started from an empty ~/.gradle (145 tasks of 145 executed).
    # main writes, the rest read — as in Unitool's android-play.yml and agentiz-client.
    - uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}

    # ~/.konan — the Kotlin/Native compiler, LLVM and the iOS platform klibs — is not part of
    # ~/.gradle and was downloaded on every run. Restore and save are split, so the toolchain is kept
    # even when the Xcode build fails after it: actions/cache saves only at the end of a green job.
    - name: Restore Kotlin/Native toolchain
      id: konan-cache
      uses: actions/cache/restore@v4
      with:
        path: ~/.konan
        key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
        restore-keys: |
          konan-${{ runner.os }}-${{ runner.arch }}-

    # The framework is linked here, before Xcode, so the build phase of iosApp finds it UP-TO-DATE.
    # Gradle's output is then visible task by task (under xcodebuild it comes in one piece at the
    # end), a Kotlin error is read here, not in xcodebuild.log, and Xcode gets a warm daemon.
    # The very task embedAndSignAppleFrameworkForXcode builds for Release on a device.
    - name: Link the Kotlin framework
      shell: bash
      run: ./gradlew :composeApp:linkReleaseFrameworkIosArm64

    - name: Save Kotlin/Native toolchain
      if: steps.konan-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@v4
      with:
        path: ~/.konan
        key: ${{ steps.konan-cache.outputs.cache-primary-key }}
