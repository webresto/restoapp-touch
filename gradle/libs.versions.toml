[versions]
# The same toolchain as Unitool (../client), so the two hosts build against one Superizer.
kotlin = "2.4.10"
composeMultiplatform = "1.11.1"
# Superizer's own: an included build with another AGP is not allowed in one Gradle build.
agp = "8.13.2"
# As in Unitool and Superizer. Google Play takes new apps and updates only at target API 36.
androidCompileSdk = "36"
androidMinSdk = "24"
androidTargetSdk = "36"
androidxActivityCompose = "1.13.0"
# java.time on API 24–25 (render's dates): the JDK's library, rewritten into the app by D8.
desugarJdkLibs = "2.1.5"
kotlinxCoroutines = "1.10.2"
# Superizer's, so the host and the library share one runtime.
kotlinxSerializationJson = "1.9.0"
# Superizer's: the host makes the one network every server shares (KtorNetworkService takes a client).
ktor = "3.4.0"
# Contract tests only: the server's JSON Schema, checked on the JVM.
jsonSchemaValidator = "1.5.9"
# The JS engine of script apps (js-module.plan.md); the version the prototype in .ai-notes/quick was measured on.
quickjs = "1.0.15"

# The library. Bumped by an explicit commit, as in Unitool.
superizer = "0.8.0"

[libraries]
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "composeMultiplatform" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivityCompose" }
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugarJdkLibs" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "jsonSchemaValidator" }
quickjs = { module = "io.github.dokar3:quickjs-kt", version.ref = "quickjs" }

superizer-core = { module = "cx.m42.superizer:core", version.ref = "superizer" }
superizer-ui-theme = { module = "cx.m42.superizer:ui-theme", version.ref = "superizer" }
superizer-ui = { module = "cx.m42.superizer:ui", version.ref = "superizer" }
superizer-host = { module = "cx.m42.superizer:host", version.ref = "superizer" }
superizer-testing = { module = "cx.m42.superizer:testing", version.ref = "superizer" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinxSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
